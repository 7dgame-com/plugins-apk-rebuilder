<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APK Rebuilder Shell Preview</title>
  <link rel="stylesheet" href="./styles/theme.css" />
  <link rel="stylesheet" href="./styles/ui.base.css" />
  <link rel="stylesheet" href="./modules/styles/shell.css" />
  <style>
    body {
      margin: 0;
    }

    .preview-layout {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    .preview-layout .sidebar {
      position: static;
      transform: none;
      min-height: 100vh;
    }

    .preview-layout .main-area {
      min-height: 100vh;
    }

    .preview-panel {
      max-width: 880px;
      padding: var(--spacing-lg);
    }

    .preview-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
    }

    .preview-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
    }

    .preview-card h2 {
      margin: 0 0 var(--spacing-sm);
      font-size: var(--font-size-xl);
      color: var(--text-primary);
    }

    .preview-card p {
      margin: 0;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .preview-icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      flex-shrink: 0;
      fill: currentColor;
      vertical-align: -0.125em;
    }

    .menu-btn .preview-icon {
      font-size: 20px;
    }

    .sidebar-close .preview-icon,
    .user-info .preview-icon {
      font-size: 16px;
    }

    .preview-layout .el-tag {
      --el-tag-bg-color: var(--el-color-primary-light-9, #ecf5ff);
      --el-tag-border-color: var(--el-color-primary-light-8, #d9ecff);
      --el-tag-text-color: var(--el-color-primary, var(--primary-color));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 24px;
      padding: 0 9px;
      border: 1px solid var(--el-tag-border-color);
      border-radius: 4px;
      background: var(--el-tag-bg-color);
      color: var(--el-tag-text-color);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .preview-layout .el-tag--small {
      height: 20px;
      padding: 0 7px;
    }

    @media (max-width: 720px) {
      .preview-layout {
        grid-template-columns: 1fr;
      }

      .preview-layout .sidebar {
        min-height: auto;
      }
    }
  </style>
</head>
<body class="apk-entry">
  <div class="app-layout preview-layout">
    <aside class="sidebar open">
      <div class="sidebar-header">
        <span class="sidebar-title">APK Rebuilder</span>
        <button class="shell-control sidebar-close" type="button" aria-label="关闭">
          <svg class="preview-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M764.288 214.592 512 466.88 259.712 214.592a31.936 31.936 0 0 0-45.12 45.12L466.752 512 214.528 764.224a31.936 31.936 0 1 0 45.12 45.184L512 557.184l252.288 252.288a31.936 31.936 0 0 0 45.12-45.12L557.12 512.064l252.288-252.352a31.936 31.936 0 1 0-45.12-45.184z" />
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <button class="shell-control sidebar-item active" type="button">
          <svg class="preview-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M800 416a288 288 0 1 0-576 0c0 118.144 94.528 272.128 288 456.576C705.472 688.128 800 534.144 800 416M512 960C277.312 746.688 160 565.312 160 416a352 352 0 0 1 704 0c0 149.312-117.312 330.688-352 544" />
            <path d="M512 512a96 96 0 1 0 0-192 96 96 0 0 0 0 192m0 64a160 160 0 1 1 0-320 160 160 0 0 1 0 320" />
          </svg>
          <span>APK 改包</span>
        </button>
        <button class="shell-control sidebar-item" type="button">
          <svg class="preview-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M600.704 64a32 32 0 0 1 30.464 22.208l35.2 109.376c14.784 7.232 28.928 15.36 42.432 24.512l112.384-24.192a32 32 0 0 1 34.432 15.36L944.32 364.8a32 32 0 0 1-4.032 37.504l-77.12 85.12a357 357 0 0 1 0 49.024l77.12 85.248a32 32 0 0 1 4.032 37.504l-88.704 153.6a32 32 0 0 1-34.432 15.296L708.8 803.904c-13.44 9.088-27.648 17.28-42.368 24.512l-35.264 109.376A32 32 0 0 1 600.704 960H423.296a32 32 0 0 1-30.464-22.208L357.696 828.48a352 352 0 0 1-42.56-24.64l-112.32 24.256a32 32 0 0 1-34.432-15.36L79.68 659.2a32 32 0 0 1 4.032-37.504l77.12-85.248a357 357 0 0 1 0-48.896l-77.12-85.248A32 32 0 0 1 79.68 364.8l88.704-153.6a32 32 0 0 1 34.432-15.296l112.32 24.256c13.568-9.152 27.776-17.408 42.56-24.64l35.2-109.312A32 32 0 0 1 423.232 64H600.64zm-23.424 64H446.72l-36.352 113.088-24.512 11.968a294 294 0 0 0-34.816 20.096l-22.656 15.36-116.224-25.088-65.28 113.152 79.68 88.192-1.92 27.136a293 293 0 0 0 0 40.192l1.92 27.136-79.808 88.192 65.344 113.152 116.224-25.024 22.656 15.296a294 294 0 0 0 34.816 20.096l24.512 11.968L446.72 896h130.688l36.48-113.152 24.448-11.904a288 288 0 0 0 34.752-20.096l22.592-15.296 116.288 25.024 65.28-113.152-79.744-88.192 1.92-27.136a293 293 0 0 0 0-40.256l-1.92-27.136 79.808-88.128-65.344-113.152-116.288 24.96-22.592-15.232a288 288 0 0 0-34.752-20.096l-24.448-11.904L577.344 128zM512 320a192 192 0 1 1 0 384 192 192 0 0 1 0-384m0 64a128 128 0 1 0 0 256 128 128 0 0 0 0-256" />
          </svg>
          <span>标准包管理</span>
        </button>
      </nav>
    </aside>

    <div class="main-area">
      <header class="navbar">
        <button class="shell-control menu-btn" type="button" aria-label="打开菜单">
          <svg class="preview-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M896 192H128v128h768zm0 256H384v128h512zm0 256H128v128h768zM320 384 128 512l192 128z" />
          </svg>
        </button>
        <h1 class="navbar-title">APK 改包</h1>
        <div class="navbar-spacer"></div>
        <div class="user-info">
          <svg class="preview-icon" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M512 512a192 192 0 1 0 0-384 192 192 0 0 0 0 384m0 64a256 256 0 1 1 0-512 256 256 0 0 1 0 512m320 320v-96a96 96 0 0 0-96-96H288a96 96 0 0 0-96 96v96a32 32 0 1 1-64 0v-96a160 160 0 0 1 160-160h448a160 160 0 0 1 160 160v96a32 32 0 1 1-64 0" />
          </svg>
          <span>Root</span>
          <span class="el-tag el-tag--small el-tag--light">root</span>
        </div>
      </header>
      <main class="content">
        <div class="preview-panel">
          <div class="preview-toolbar">
            <button class="secondary" type="button">普通业务按钮</button>
            <button class="btn submit-btn" type="button">主操作按钮</button>
            <button class="btn-ghost" type="button">业务 Ghost 按钮</button>
          </div>
          <section class="preview-card">
            <h2>Shell 样式预览</h2>
            <p>这个页面只用于检查插件壳层：顶部菜单、左侧菜单、用户身份、选中态和 hover/active 态。业务按钮仍使用全局按钮样式，壳层按钮使用 shell-control 隔离。</p>
          </section>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
