name: Configure COS CORS

on:
  workflow_dispatch:
    inputs:
      extra_origins:
        description: 'Optional extra origins, comma or newline separated'
        required: false
        default: ''

jobs:
  configure:
    name: Apply Bucket CORS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure COS CORS
        env:
          SECRET_ID: ${{ secrets.SECRET_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          COS_BUCKETS_PUBLIC_BUCKET: ${{ secrets.COS_BUCKETS_PUBLIC_BUCKET }}
          COS_BUCKETS_PUBLIC_REGION: ${{ secrets.COS_BUCKETS_PUBLIC_REGION }}
          COS_CORS_EXTRA_ORIGINS: ${{ inputs.extra_origins }}
        run: node scripts/configure-cos-cors.js
