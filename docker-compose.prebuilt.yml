x-apk-rebuilder-service: &apk-rebuilder-service
  image: ${APK_REBUILDER_IMAGE:-hkccr.ccs.tencentyun.com/plugins/apk-rebuilder:publish}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped

x-redis-service: &redis-service
  image: redis:7-alpine
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  apk-rebuilder-d:
    <<: *apk-rebuilder-service
    ports:
      - '3007:80'
    environment:
      APP_API_1_URL: https://api.d.xrteeth.com
      APP_API_2_URL: https://api.d.tmrpp.com
      PORT: 3007
      HOST: 0.0.0.0
      MAIN_API_URL: https://api.d.xrteeth.com
      HOST_API_BASE: https://api.d.xrteeth.com
      STRICT_TOOLCHAIN: "true"
      STRICT_REDIS: "true"
      PLUGIN_TOKEN_SECRET: change-me
      REDIS_HOST: redis-apk-rebuilder-d
      REDIS_PORT: 6379
    depends_on:
      redis-apk-rebuilder-d:
        condition: service_healthy

  apk-rebuilder:
    <<: *apk-rebuilder-service
    ports:
      - '3008:80'
    environment:
      APP_API_1_URL: https://api.xrteeth.com
      APP_API_2_URL: https://api.tmrpp.com
      PORT: 3007
      HOST: 0.0.0.0
      MAIN_API_URL: https://api.xrteeth.com
      HOST_API_BASE: https://api.xrteeth.com
      STRICT_TOOLCHAIN: "true"
      STRICT_REDIS: "true"
      PLUGIN_TOKEN_SECRET: change-me
      REDIS_HOST: redis-apk-rebuilder
      REDIS_PORT: 6379
    depends_on:
      redis-apk-rebuilder:
        condition: service_healthy

  redis-apk-rebuilder-d:
    <<: *redis-service
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - apk_rebuilder_d_redis_data:/data

  redis-apk-rebuilder:
    <<: *redis-service
    ports:
      - '127.0.0.1:16380:6379'
    volumes:
      - apk_rebuilder_redis_data:/data

volumes:
  apk_rebuilder_d_redis_data:
  apk_rebuilder_redis_data:
